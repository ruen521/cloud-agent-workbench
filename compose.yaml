services:
  workbench:
    build: .
    init: true
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-3000}:3000"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - workbench-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  workbench-data:
